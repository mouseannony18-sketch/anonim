<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengalihkan ke Alamat Baru...</title>
    <!-- Tailwind CSS untuk styling cepat dan modern -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Meta Refresh Fallback (3 detik) -->
    <meta http-equiv="refresh" content="3;url=https://mouseannony.netlify.app">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-800 border border-gray-700 rounded-2xl p-8 shadow-2xl text-center space-y-6">
        
        <!-- Animasi Loading Berputar (Spinner) -->
        <div class="flex justify-center">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 border-4 border-gray-700 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-cyan-400 rounded-full border-t-transparent animate-spin"></div>
            </div>
        </div>

        <div class="space-y-2">
            <h2 class="text-lg font-extrabold text-yellow-400 tracking-wide">
                ⚠️ Tautan Telah Dipindahkan
            </h2>
            <p class="text-xs text-gray-300 leading-relaxed">
                Halaman web aplikasi ini telah diupdate ke versi terbaru dan dipindahkan alamat aplikasi webnya demi keamanan dan performa yang lebih baik.
            </p>
        </div>

        <div class="bg-gray-900/60 border border-gray-700/80 p-3 rounded-xl text-xs text-cyan-300 font-mono">
            🔄 Mengalihkan otomatis dalam <span id="countdown" class="font-bold text-yellow-400 text-sm">7</span> detik...
        </div>

        <div>
            <a id="redirectLink" href="https://mouseannony.netlify.app" class="block w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg text-sm transition-transform active:scale-95">
                🚀 Buka Sekarang
            </a>
        </div>
    </div>

    <!-- Script Countdown 3 Detik & Redirect Otomatis -->
    <script>
        const targetUrl = "https://mouseannony.netlify.app";
        document.getElementById('redirectLink').href = targetUrl;

        let timeLeft = 7;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                countdownEl.innerText = timeLeft;
            } else {
                clearInterval(timer);
                window.location.replace(targetUrl);
            }
        }, 1000);
    </script>
</body>
</html>
